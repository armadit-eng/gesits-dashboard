name: Build Android APK

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Bump versionCode and versionName
        id: bump
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path

          gradle_file = Path("app/build.gradle")
          content = gradle_file.read_text(encoding="utf-8")

          vc_match = re.search(r'(^\s*versionCode\s+)(\d+)', content, re.MULTILINE)
          vn_match = re.search(r'(^\s*versionName\s+["\'])([^"\']+)(["\'])', content, re.MULTILINE)
          if not vc_match or not vn_match:
              raise SystemExit("Could not find versionCode or versionName in app/build.gradle")

          old_vc = int(vc_match.group(2))
          new_vc = old_vc + 1

          old_vn = vn_match.group(2)
          parts = old_vn.split(".")
          if parts[-1].isdigit():
              parts[-1] = str(int(parts[-1]) + 1)
          else:
              parts.append("1")
          new_vn = ".".join(parts)

          content = re.sub(
              r'(^\s*versionCode\s+)\d+',
              rf'\g<1>{new_vc}',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          content = re.sub(
              r'(^\s*versionName\s+["\'])([^"\']+)(["\'])',
              rf'\g<1>{new_vn}\g<3>',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          gradle_file.write_text(content, encoding="utf-8")

          print(f"Bumped versionCode: {old_vc} -> {new_vc}")
          print(f"Bumped versionName: {old_vn} -> {new_vn}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version_code={new_vc}\n")
              out.write(f"version_name={new_vn}\n")
          EOF

      - name: Prepare debug keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK output
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            "GesitsDashboard-v${{ steps.bump.outputs.version_name }}-vc${{ steps.bump.outputs.version_code }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GesitsDashboard-v${{ steps.bump.outputs.version_name }}-debug
          path: GesitsDashboard-v${{ steps.bump.outputs.version_name }}-vc${{ steps.bump.outputs.version_code }}-debug.apk
          retention-days: 30

      - name: Commit bumped version back to repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ steps.bump.outputs.version_name }} (${{ steps.bump.outputs.version_code }}) [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version_name }}
          name: "GESITS Dashboard ${{ steps.bump.outputs.version_name }}"
          generate_release_notes: true
          files: GesitsDashboard-v${{ steps.bump.outputs.version_name }}-vc${{ steps.bump.outputs.version_code }}-debug.apk
