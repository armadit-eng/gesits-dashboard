name: Build Android APK

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Bump versionCode and versionName
        id: bump
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path

          gradle_file = Path("app/build.gradle")
          content = gradle_file.read_text(encoding="utf-8")

          vc_match = re.search(r'(^\s*versionCode\s+)(\d+)', content, re.MULTILINE)
          vn_match = re.search(r'(^\s*versionName\s+["\'])([^"\']+)(["\'])', content, re.MULTILINE)
          if not vc_match or not vn_match:
              raise SystemExit("Could not find versionCode or versionName in app/build.gradle")

          old_vc = int(vc_match.group(2))
          new_vc = old_vc + 1

          old_vn = vn_match.group(2)
          parts = old_vn.split(".")
          if parts[-1].isdigit():
              parts[-1] = str(int(parts[-1]) + 1)
          else:
              parts.append("1")
          new_vn = ".".join(parts)

          content = re.sub(
              r'(^\s*versionCode\s+)\d+',
              rf'\g<1>{new_vc}',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          content = re.sub(
              r'(^\s*versionName\s+["\'])([^"\']+)(["\'])',
              rf'\g<1>{new_vn}\g<3>',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          gradle_file.write_text(content, encoding="utf-8")

          index_file = Path("app/src/main/assets/index.html")
          if index_file.exists():
              idx_txt = index_file.read_text(encoding="utf-8")
              idx_txt = re.sub(r"(const APP_VERSION\s*=\s*['\"])([^'\"]+)(['\"];)", rf"\g<1>{new_vn}\g<3>", idx_txt, count=1)
              idx_txt = re.sub(r"(const APP_VERSION_CODE\s*=\s*)(\d+)(;)", rf"\g<1>{new_vc}\g<3>", idx_txt, count=1)
              index_file.write_text(idx_txt, encoding="utf-8")

          sw_file = Path("app/src/main/assets/sw.js")
          if sw_file.exists():
              sw_txt = sw_file.read_text(encoding="utf-8")
              sw_txt = re.sub(r"(const VERSION\s*=\s*['\"])([^'\"]+)(['\"];)", rf"\g<1>v{new_vn}\g<3>", sw_txt, count=1)
              sw_file.write_text(sw_txt, encoding="utf-8")

          print(f"Bumped versionCode: {old_vc} -> {new_vc}")
          print(f"Bumped versionName: {old_vn} -> {new_vn}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version_code={new_vc}\n")
              out.write(f"version_name={new_vn}\n")
          EOF

      - name: Prepare debug keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: sh ./gradlew assembleDebug --no-daemon

      - name: Rename APK output
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            "GesitsDashboard-v${{ steps.bump.outputs.version_name }}-vc${{ steps.bump.outputs.version_code }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GesitsDashboard-v${{ steps.bump.outputs.version_name }}-debug
          path: GesitsDashboard-v${{ steps.bump.outputs.version_name }}-vc${{ steps.bump.outputs.version_code }}-debug.apk
          retention-days: 30

      - name: Commit bumped version back to repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/index.html app/src/main/assets/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ steps.bump.outputs.version_name }} (${{ steps.bump.outputs.version_code }}) [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Generate release changelog
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          VERSION_NAME: ${{ steps.bump.outputs.version_name }}
          VERSION_CODE: ${{ steps.bump.outputs.version_code }}
        run: |
          python3 - <<'EOF'
          import os, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True, stderr=subprocess.DEVNULL).strip()

          try:
              last_tag = git("describe", "--tags", "--abbrev=0")
              log_range = f"{last_tag}..HEAD"
          except Exception:
              last_tag = ""
              log_range = "-n10"

          raw_logs = git("log", log_range, "--pretty=format:%s")
          lines = [
              ln.strip() for ln in raw_logs.splitlines()
              if ln.strip()
              and not ln.strip().startswith("chore: bump version")
              and "[skip ci]" not in ln
          ]

          v_name = os.environ.get("VERSION_NAME", "")
          v_code = os.environ.get("VERSION_CODE", "")
          notes = [f"### Perubahan di v{v_name} (Build {v_code})"]
          if lines:
              for ln in lines[:20]:
                  notes.append(f"- {ln}")
          else:
              notes.append("- Pembaruan stabilitas, perbaikan bug, dan peningkatan performa aplikasi.")

          Path("release_notes.md").write_text("\n".join(notes) + "\n", encoding="utf-8")
          EOF

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version_name }}
          name: "GESITS Dashboard ${{ steps.bump.outputs.version_name }}"
          body_path: release_notes.md
          generate_release_notes: true
          files: GesitsDashboard-v${{ steps.bump.outputs.version_name }}-vc${{ steps.bump.outputs.version_code }}-debug.apk

      - name: Deploy PWA to Cloudflare Pages (gesits.pages.dev)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/src/main/assets --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'gesits' }} --branch=${{ github.ref_name }}
